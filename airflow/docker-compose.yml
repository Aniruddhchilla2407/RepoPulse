x-airflow-common: &airflow-common
  image: repopulse-airflow:2.10.5
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__WEBSERVER__SECRET_KEY: repopulse-local-dev-secret
    PYTHONPATH: /opt/repopulse/src
    SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-3g}
    REPOPULSE_DEFAULT_END_HOUR: ${REPOPULSE_DEFAULT_END_HOUR:-5}
    # Warehouse file. Default: the same file the host uses (bind-mounted repo).
    # If DuckDB reports a file-locking error, set REPOPULSE_DB=/opt/airflow/warehouse/repopulse.duckdb
    # in airflow/.env to keep the file on a Docker volume instead.
    REPOPULSE_DB: ${REPOPULSE_DB:-data/warehouse/repopulse.duckdb}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ..:/opt/repopulse
    - airflow-warehouse:/opt/airflow/warehouse

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      bash -c "airflow db migrate &&
      (airflow users create --username admin --password admin --firstname Repo
      --lastname Pulse --role Admin --email admin@example.com || true)"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-pg:
  airflow-warehouse:
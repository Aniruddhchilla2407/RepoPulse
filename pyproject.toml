[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repopulse"
version = "0.3.0"
description = "GitHub activity data pipeline (GH Archive -> Spark -> DuckDB/dbt -> ML)"
requires-python = ">=3.10"
dependencies = [
    "pyspark==3.5.3",
    "numpy>=1.21.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
warehouse = [
    "duckdb>=1.1",
    "pyarrow>=15",
]
dbt = [
    "dbt-core>=1.10,<1.11",
    "dbt-duckdb>=1.9,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP"]
ignore = ["E501"]
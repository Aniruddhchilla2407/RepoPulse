name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REPOPULSE_DB: ":memory:"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e ".[dev,warehouse,dbt]"

      - name: Lint
        run: ruff check .

      - name: Unit and SQL end-to-end tests
        run: pytest -q

      - name: dbt parse
        run: dbt parse --project-dir dbt --profiles-dir dbt

      - name: dbt compile
        run: dbt compile --project-dir dbt --profiles-dir dbt

  airflow-dag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Airflow (pinned by the official constraints file)
        run: |
          pip install "apache-airflow==2.10.5" pytest \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt"

      - name: DAG integrity tests
        run: pytest -q tests/test_dag_integrity.py